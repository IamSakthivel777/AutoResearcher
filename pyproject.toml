[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "autoresearcher-ai"
version = "0.1.1"
description = "Multi-agent research that produces source-grounded Word reports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "sakthivel" }]
keywords = ["llm", "agents", "research", "langgraph", "docx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    # These ranges share LangChain Core 1.x with applications that already use
    # ``langchain>=1,<2``.  Keep the integrations on their current major lines
    # so pip does not downgrade an application's LangChain installation.
    "langchain-anthropic>=1,<2",
    "langchain-google-genai>=4,<5",
    "langchain-openai>=1,<2",
    "langgraph>=1,<2",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "python-docx>=1.1,<2",
    "tenacity>=8.2,<10",
    "typer>=0.12,<1",
    "rich>=13.7,<15",
    "ddgs>=9,<10",
]

[project.optional-dependencies]
pinecone = ["pinecone>=5,<8"]
chroma = ["chromadb>=0.5,<2"]
api = ["fastapi>=0.115,<1", "sse-starlette>=2.1,<4", "uvicorn>=0.30,<1"]
dev = [
    "build>=1.2,<2",
    "mypy>=1.11,<2",
    "pre-commit>=3.8,<5",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "respx>=0.21,<1",
    "ruff>=0.6,<1",
    "twine>=5.1,<7",
]
all = [
    "chromadb>=0.5,<2",
    "fastapi>=0.115,<1",
    "langchain-mcp-adapters>=0.1,<1",
    "mcp>=1.0,<2",
    "pinecone>=5,<8",
    "sse-starlette>=2.1,<4",
    "uvicorn>=0.30,<1",
]

[project.scripts]
autoresearcher = "autoresearcher.cli:main"

[project.urls]
Homepage = "https://github.com/IamSakthivel777/AutoResearcher"
Issues = "https://github.com/IamSakthivel777/AutoResearcher/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/autoresearcher"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
exclude = [
    "/.agents",
    "/.codex",
    "/.venv",
    "/dist",
    "/env",
    "/myenv",
    "/venv",
]

[tool.pytest.ini_options]
addopts = "-ra -q -m 'not live'"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: uses real external services (skipped by default)"]
filterwarnings = [
    "ignore:The default value of `allowed_objects` will change.*:langchain_core._api.deprecation.LangChainPendingDeprecationWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["autoresearcher"]
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["docx.*", "ddgs.*"]
ignore_missing_imports = true
